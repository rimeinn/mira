name: Commit CI

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:testing
    strategy:
      matrix:
        librime: ["", "master", "1.16.1", "1.15.0", "1.14.0", "1.13.1"]
        lua_version: ["5.2", "5.3", "5.4", "5.5", "jit", ""]
    steps:
      - name: Install deps
        run: apt-get update && apt-get -y install build-essential ca-certificates git meson cmake libargparse-dev libyaml-cpp-dev libboost-dev libboost-regex-dev liblua5.1-dev liblua5.2-dev liblua5.3-dev liblua5.4-dev liblua5.5-dev libluajit-5.1-dev
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          mkdir dist
          LUA_OPT=""
          if [ -n "${{ matrix.lua_version }}" ]; then
            LUA_OPT="-Dlua_version=${{ matrix.lua_version }}"
          fi
          meson setup build --prefer-static \
              --prefix=$(realpath ./dist) \
              --buildtype=release \
              $LUA_OPT \
              "-Dlibrime_commit=${{ matrix.librime }}"
          ninja install -C build
      - name: Compute artifact name
        id: artifact
        run: |
          NAME="mira"
          [ -n "${{ matrix.librime }}" ]     && NAME="${NAME}-rime${{ matrix.librime }}"
          [ -n "${{ matrix.lua_version }}" ] && NAME="${NAME}-lua${{ matrix.lua_version }}"
          echo "name=${NAME}" >> $GITHUB_OUTPUT
      - name: Rename artifact
        if: steps.artifact.outputs.name != 'mira'
        run: cp dist/bin/mira dist/bin/${{ steps.artifact.outputs.name }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/bin/${{ steps.artifact.outputs.name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'rimeinn/mira' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/bin
          merge-multiple: true
      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          prerelease: true
          make_latest: true
          name: "Latest build"
          files: dist/bin/mira*
